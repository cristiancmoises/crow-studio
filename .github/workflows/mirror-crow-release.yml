name: Mirror Crow Studio release
on:
  push:
    branches: [release-automation]
    paths: [.github/workflows/mirror-crow-release.yml]
permissions:
  contents: write
concurrency:
  group: mirror-crow-studio-0.2.0
  cancel-in-progress: false
jobs:
  mirror:
    if: github.repository == 'cristiancmoises/crow-studio'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify and publish the signed release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'CROW_RELEASE_PYTHON'
          #!/usr/bin/env python3
          import hashlib
          import json
          import os
          import re
          import subprocess
          import tempfile
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path
          
          PLAN = {'commit': '7ef85a4a5c3eb099538688e9f6ccca4155aa7239', 'tree': '73cab4bd895d8e6e3cf62876826aaf30dc045a8b', 'tag': 'v0.2.0', 'tag_object': '3438b856669b869717fd2d95b757018902c8f22c', 'fingerprint': '0CFA43B9AA9642EAAF2BE983C4C661C9ECFB46E8', 'public_key': '-----BEGIN PGP PUBLIC KEY BLOCK-----\n\nmDMEajsELhYJKwYBBAHaRw8BAQdAx7jgeKA38pwfqYwsruczyfGqqncPbf/BIU5J\nhYIbRX+0MUNyaXN0aWFuIENlemFyIE1vaXPDqXMgPGV0aGljYWxoYWNrZXJAcmlz\nZXVwLm5ldD6IkwQTFgoAOxYhBAz6Q7mqlkLqryvpg8TGYcns+0boBQJqOwQuAhsD\nBQsJCAcCAiICBhUKCQgLAgQWAgMBAh4HAheAAAoJEMTGYcns+0boQt4BALRFippx\nQOLZup7UQt3WvuOVKFdmRh82AIuBedfGXRq7AQDd88rOACwwTpF5Fu141qR/C3NF\ntuohwE2DX6Fme4VyD7QzQ3Jpc3RpYW4gQ2V6YXIgTW9pc8OpcyA8Y3Jpc3RpYW5j\nbW9pc2VzQHJpc2V1cC5uZXQ+iJMEExYKADsWIQQM+kO5qpZC6q8r6YPExmHJ7PtG\n6AUCarEHAgIbAwULCQgHAgIiAgYVCgkICwIEFgIDAQIeBwIXgAAKCRDExmHJ7PtG\n6D2jAQDuetmTD726OmBHPam0yGFwzEqAvJLCYG47qyZq8xHmwwD/S1lgu9BRlaE5\nQ6ffEvOQcyrT7rStzJRxGyXYL+LFxg60O0NyaXN0aWFuIENlemFyIE1vaXPDqXMg\nPGNyaXN0aWFuY21vaXNlc0BzZWN1cml0eW9wcy5jb20uYnI+iJMEExYKADsWIQQM\n+kO5qpZC6q8r6YPExmHJ7PtG6AUCarEHAgIbAwULCQgHAgIiAgYVCgkICwIEFgID\nAQIeBwIXgAAKCRDExmHJ7PtG6L5HAP0cgW5CNMsc/l4KiVhDdajm+NQArTc21mCa\nnaAchZg9nwEA3CBm4Y/zI8t3Z02RucsZFH9s+93XerC/a5TFwM08xQq0HUJlcmtl\nbGV5IDxzYWNAc2VjdXJpdHlvcHMuY28+iJMEExYKADsWIQQM+kO5qpZC6q8r6YPE\nxmHJ7PtG6AUCarEHAwIbAwULCQgHAgIiAgYVCgkICwIEFgIDAQIeBwIXgAAKCRDE\nxmHJ7PtG6HKbAQCzwVYaRO5tKQk0lMOBlAXnZ4ymaPHAzCdU6pTYetfJTQEA7nyn\nVELy/i24o7cfdX7jymSIpcIBEP7WbyQhFd9xcga4OARqOwQuEgorBgEEAZdVAQUB\nAQdATN6gaeMfK5ks457X9YJWleUm59jSQI+urdq5TnpCoz4DAQgHiHgEGBYKACAW\nIQQM+kO5qpZC6q8r6YPExmHJ7PtG6AUCajsELgIbDAAKCRDExmHJ7PtG6E4YAQDe\nbzXlgXxa2j7iEMvjaWpE4TMTZx4H7RR+H2XHEihuTwEAh/ESq9Cbfs40DCQPOZQG\nrayBhDrBJU6h1K/NNcoN9QA=\n=fdPd\n-----END PGP PUBLIC KEY BLOCK-----\n', 'assets': {'crow-studio-0.2.0.zupt': 'cd23123ebef63d65d82fffdee2d7d487948c48271981f7e57f070e27a60b0317', 'SHA256SUMS': 'c820ff8263d47445d32f80ebfd8018e8d40eee5a35b32ed82cca3f0d88c589ae', 'SHA256SUMS.asc': '17de4ef3b316a8b10b194517bf9bf016e47fe28c415d6a5840e28c88702ce53d', 'INTEGRITY.json': 'b8f19a85199ba61137ef398ef0731878e2c83f70520028bc94f804d7f98a34e8', 'INTEGRITY.json.asc': '6a6c104899e3a6b2e6a05ebbe019fcbaa3e4685ba358a6c025629baf82a7375d'}, 'notes': 'Crow Studio 0.2.0 amplia a criação de apresentações e peças visuais com geração local, catálogo pesquisável e exportação PowerPoint editável.\n\n- 4.812 composições: 4.800 variações de 20 famílias de layout, 6 paletas, 8 temas e 5 formatos, além dos 12 templates originais.\n- Geração com Qwen3 local no Ollama, com limites de memória, CPU, concorrência e tempo; provedor Qwen Code opcional.\n- PowerPoint (.pptx) com todas as páginas, texto e formas editáveis, imagens incorporadas, recorte, rotação e camadas ocultas respeitados.\n- Demonstração sem senha, com projetos no navegador, até 5 projetos, 3 páginas, 60 elementos por página e uploads desabilitados. A geração pública tem quotas persistentes.\n- Guias completos em português e inglês, instalação com modelo fixado e orientações de backup e verificação.\n\nExperimente: https://crow.securityops.co/demo ou https://crow.securityops.com.br/demo.\n\nEstúdio privado: https://crow.securityops.co ou https://crow.securityops.com.br.\n\n[Guia em português](https://git.securityops.com.br/cristiancmoises/crow-studio/src/tag/v0.2.0/docs/GUIDE.pt-BR.md) · [English guide](https://git.securityops.com.br/cristiancmoises/crow-studio/src/tag/v0.2.0/docs/GUIDE.en.md) · [Verificação de integridade / Integrity verification](https://git.securityops.com.br/cristiancmoises/crow-studio/src/tag/v0.2.0/docs/INTEGRITY.md)\n\nO pacote público é um arquivo `.zupt` sem criptografia. Confira `SHA256SUMS.asc` e `INTEGRITY.json.asc` com GPG, valide `SHA256SUMS` e execute `zupt test` antes de extrair. O registro autenticado inclui os dois fingerprints e o checkpoint da assinatura híbrida CodeMark. Consulte o guia de integridade para restaurar os modos POSIX antes dessa verificação.\n\nCrow Studio 0.2.0 expands presentation and visual design workflows with local generation, a searchable catalog and editable PowerPoint export.\n\n- 4,812 compositions: 4,800 variations from 20 layout families, 6 palettes, 8 topics and 5 formats, plus the 12 original templates.\n- Local Qwen3 generation through Ollama with memory, CPU, concurrency and time limits; optional Qwen Code provider.\n- PowerPoint (.pptx) containing every page, editable text and shapes, embedded images, cropping, rotation and hidden-layer handling.\n- Password-free demonstration with browser-local projects, up to 5 projects, 3 pages and 60 elements per page; file uploads are disabled. Public generation uses persistent quotas.\n- Full Portuguese and English guides covering pinned model setup, backups and verification.\n\nTry the demo: https://crow.securityops.co/demo or https://crow.securityops.com.br/demo.\n\nThe public package is an unencrypted `.zupt` archive. Verify `SHA256SUMS.asc` and `INTEGRITY.json.asc` with GPG, check `SHA256SUMS` and run `zupt test` before extraction. The authenticated record includes both fingerprints and the CodeMark hybrid-signature checkpoint. Follow the integrity guide to restore POSIX modes before that verification.\n', 'notes_sha256': 'f9634f45f49fc1bb865fab1f5d17c54bfd4a555ffb157488d17c657e1a5c1513', 'github_main_before': '28e08b5dea133811dcefd4e731e589ebf91b540f', 'parents': ['b4f50071402395cec18c19d9cb5e54adc0523eef', '28e08b5dea133811dcefd4e731e589ebf91b540f']}
          REPOSITORY = "cristiancmoises/crow-studio"
          FORGE = "git.securityops.com.br"
          FORGE_REPOSITORY = "cristiancmoises/crow-studio"
          GITHUB_MAIN_BEFORE = "28e08b5dea133811dcefd4e731e589ebf91b540f"
          RELEASE_PARENTS = ["b4f50071402395cec18c19d9cb5e54adc0523eef", GITHUB_MAIN_BEFORE]
          ASSETS = (
              "crow-studio-0.2.0.zupt",
              "SHA256SUMS",
              "SHA256SUMS.asc",
              "INTEGRITY.json",
              "INTEGRITY.json.asc",
          )
          LIMIT = 64 * 1024 * 1024
          
          
          class MirrorError(Exception):
              pass
          
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          
          def sha256(data):
              return hashlib.sha256(data).hexdigest()
          
          
          def safe_url(url, hosts):
              parsed = urllib.parse.urlsplit(url)
              if (
                  parsed.scheme != "https"
                  or parsed.netloc not in hosts
                  or parsed.username
                  or parsed.password
                  or parsed.fragment
              ):
                  raise MirrorError("Rejected network destination")
              return True
          
          
          def http(
              url,
              *,
              token=None,
              method="GET",
              data=None,
              binary=False,
              content_type="application/json",
              redirects=0,
          ):
              safe_url(
                  url,
                  {
                      FORGE,
                      "api.github.com",
                      "uploads.github.com",
                      "github.com",
                      "release-assets.githubusercontent.com",
                  },
              )
              host = urllib.parse.urlsplit(url).netloc
              if token and host not in {"api.github.com", "uploads.github.com"}:
                  raise MirrorError("Rejected authenticated destination")
              headers = {
                  "User-Agent": "Crow-release-mirror",
                  "Accept": "application/octet-stream" if binary else "application/json",
              }
              if token:
                  headers["Authorization"] = "Bearer " + token
                  headers["X-GitHub-Api-Version"] = "2026-03-10"
              if data is not None:
                  headers["Content-Type"] = content_type
              request = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.build_opener(NoRedirect()).open(
                      request, timeout=90
                  ) as response:
                      payload = response.read(LIMIT + 1)
                      if len(payload) > LIMIT:
                          raise MirrorError("Response exceeds the mirror budget")
                      return response.status, payload if binary else json.loads(payload)
              except urllib.error.HTTPError as error:
                  if binary and method == "GET" and error.code in {301, 302, 303, 307, 308}:
                      if redirects >= 2:
                          raise MirrorError("Download redirect limit exceeded")
                      destination = error.headers.get("Location", "")
                      safe_url(destination, {"release-assets.githubusercontent.com"})
                      return http(destination, binary=True, redirects=redirects + 1)
                  return error.code, b"" if binary else {}
              except (OSError, ValueError):
                  raise MirrorError("Network operation failed for " + host) from None
          
          
          def emit(**fields):
              print(json.dumps(fields), flush=True)
          
          
          def command(args, *, cwd=None, env=None, input_data=None):
              result = subprocess.run(
                  [str(v) for v in args],
                  cwd=cwd,
                  env=env,
                  input=input_data,
                  capture_output=True,
                  check=False,
                  timeout=180,
              )
              if result.returncode:
                  raise MirrorError(
                      Path(args[0]).name + " failed with exit " + str(result.returncode)
                  )
              return result.stdout
          
          
          def valid_gpg(status, fingerprint):
              return any(
                  line.startswith("[GNUPG:] VALIDSIG " + fingerprint + " ")
                  for line in status.splitlines()
              )
          
          
          def validate_plan(plan):
              required = {
                  "commit",
                  "tree",
                  "tag",
                  "tag_object",
                  "fingerprint",
                  "public_key",
                  "assets",
                  "notes",
                  "notes_sha256",
                  "github_main_before",
                  "parents",
              }
              if (
                  not isinstance(plan, dict)
                  or set(plan) != required
                  or plan.get("tag") != "v0.2.0"
              ):
                  raise MirrorError("Concrete reviewed release pins required")
              for name in ["commit", "tree", "tag_object"]:
                  if not re.fullmatch(r"[0-9a-f]{40}", plan[name]):
                      raise MirrorError("Full approved Git object required")
              if (
                  plan["github_main_before"] != GITHUB_MAIN_BEFORE
                  or plan["parents"] != RELEASE_PARENTS
              ):
                  raise MirrorError("Expected reviewed integration parents and GitHub base")
              if not re.fullmatch(r"[A-F0-9]{40}", plan["fingerprint"]):
                  raise MirrorError("Full signer fingerprint required")
              if set(plan["assets"]) != set(ASSETS) or any(
                  not re.fullmatch(r"[0-9a-f]{64}", v) for v in plan["assets"].values()
              ):
                  raise MirrorError("Exact five artifact digests required")
              if (
                  sha256(plan["notes"].encode()) != plan["notes_sha256"]
                  or "https://crow.securityops.co/demo" not in plan["notes"]
              ):
                  raise MirrorError("Release description differs from reviewed text")
              if (
                  not plan["public_key"].startswith("-----BEGIN PGP PUBLIC KEY BLOCK-----")
                  or "PRIVATE KEY" in plan["public_key"]
              ):
                  raise MirrorError("Public verification key required")
          
          
          def refs_to_push(refs, plan, is_ancestor):
              tag = "refs/tags/" + plan["tag"]
              branch = "refs/heads/signed-releases"
              result = []
              main = refs.get("refs/heads/main")
              if main not in {plan["github_main_before"], plan["commit"]}:
                  raise MirrorError("GitHub main differs from the approved base or release")
              if not is_ancestor(plan["github_main_before"], plan["commit"]):
                  raise MirrorError("Approved GitHub main is not an ancestor of the release")
              if tag in refs and (
                  refs[tag] != plan["tag_object"] or refs.get(tag + "^{}") != plan["commit"]
              ):
                  raise MirrorError("Existing GitHub tag differs from approved tag")
              if (
                  branch in refs
                  and refs[branch] != plan["commit"]
                  and not is_ancestor(refs[branch], plan["commit"])
              ):
                  raise MirrorError("Existing signed release branch diverges")
              if main != plan["commit"]:
                  result.append(plan["commit"] + ":refs/heads/main")
              if refs.get(branch) != plan["commit"]:
                  result.append(plan["commit"] + ":" + branch)
              if tag not in refs:
                  result.append(plan["tag_object"] + ":" + tag)
              return result
          
          
          def check_asset(asset, name, data, expected):
              if (
                  asset.get("name") != name
                  or asset.get("size") != len(data)
                  or sha256(data) != expected
              ):
                  raise MirrorError("Release asset differs: " + name)
              return True
          
          
          def main():
              validate_plan(PLAN)
              plan = PLAN
              if (
                  os.environ.get("GITHUB_REPOSITORY") != REPOSITORY
                  or os.environ.get("GITHUB_REF") != "refs/heads/release-automation"
              ):
                  raise MirrorError("Unexpected workflow repository or branch")
              token = os.environ.get("GH_TOKEN")
              if not token:
                  raise MirrorError("Repository job token unavailable")
              with tempfile.TemporaryDirectory(prefix="crow-release-mirror-") as temporary:
                  root = Path(temporary)
                  repository = root / "objects.git"
                  gnupg = root / "gnupg"
                  gnupg.mkdir(mode=0o700)
                  env = {
                      **os.environ,
                      "GNUPGHOME": str(gnupg),
                      "GIT_TERMINAL_PROMPT": "0",
                      "GIT_ASKPASS": "/bin/false",
                  }
                  key = root / "verification.asc"
                  key.write_text(plan["public_key"])
                  shown = command(
                      ["gpg", "--batch", "--with-colons", "--show-keys", key], env=env
                  ).decode()
                  fingerprints = [
                      line.split(":")[9] for line in shown.splitlines() if line.startswith("fpr:")
                  ]
                  if not fingerprints or fingerprints[0] != plan["fingerprint"]:
                      raise MirrorError("Public key fingerprint differs")
                  command(["gpg", "--batch", "--import", key], env=env)
                  command(["git", "init", "--bare", repository], env=env)
          
                  def git(*args):
                      return (
                          command(
                              [
                                  "git",
                                  "-C",
                                  repository,
                                  "-c",
                                  "http.followRedirects=false",
                                  "-c",
                                  "credential.helper=",
                                  *args,
                              ],
                              env=env,
                          )
                          .decode()
                          .strip()
                      )
          
                  git(
                      "fetch",
                      "--no-tags",
                      "https://" + FORGE + "/" + FORGE_REPOSITORY + ".git",
                      "refs/tags/" + plan["tag"] + ":refs/tags/" + plan["tag"],
                  )
                  for expression, expected in [
                      ("refs/tags/" + plan["tag"], plan["tag_object"]),
                      (plan["tag"] + "^{commit}", plan["commit"]),
                      (plan["tag"] + "^{tree}", plan["tree"]),
                  ]:
                      if git("rev-parse", expression) != expected:
                          raise MirrorError("Imported Git object differs")
                  if git("cat-file", "-t", "refs/tags/" + plan["tag"]) != "tag":
                      raise MirrorError("Signed annotated tag required")
                  if git("show", "-s", "--format=%P", plan["commit"]).split() != plan["parents"]:
                      raise MirrorError("Imported integration parents differ")
                  if git(
                      "log", "--format=", "--name-only", plan["commit"], "--", ".github/workflows"
                  ).strip():
                      raise MirrorError("Imported history changes workflow files")
                  for operation, target in [
                      ("verify-tag", plan["tag"]),
                      ("verify-commit", plan["commit"]),
                  ]:
                      result = subprocess.run(
                          ["git", "-C", str(repository), operation, "--raw", target],
                          env=env,
                          capture_output=True,
                          check=False,
                          timeout=60,
                      )
                      if result.returncode or not valid_gpg(
                          result.stderr.decode(), plan["fingerprint"]
                      ):
                          raise MirrorError("Pinned Git signature verification failed")
                  forge_api = "https://" + FORGE + "/api/v1/repos/" + FORGE_REPOSITORY
                  status, origin = http(forge_api + "/releases/tags/" + plan["tag"])
                  if status != 200 or origin.get("draft") is not False:
                      raise MirrorError("Primary release is not public")
                  status, assets = http(forge_api + "/releases/" + str(origin["id"]) + "/assets")
                  if (
                      status != 200
                      or len(assets) != len(ASSETS)
                      or {a.get("name") for a in assets} != set(ASSETS)
                  ):
                      raise MirrorError("Primary asset list differs")
                  blobs = {}
                  for asset in assets:
                      name = asset["name"]
                      url = asset.get("browser_download_url", "")
                      safe_url(url, {FORGE})
                      status, data = http(url, binary=True)
                      if status != 200 or not check_asset(
                          asset, name, data, plan["assets"][name]
                      ):
                          raise MirrorError("Primary asset verification failed")
                      blobs[name] = data
                      (root / name).write_bytes(data)
                  for name in ["SHA256SUMS", "INTEGRITY.json"]:
                      result = subprocess.run(
                          [
                              "gpg",
                              "--batch",
                              "--status-fd",
                              "1",
                              "--verify",
                              str(root / (name + ".asc")),
                              str(root / name),
                          ],
                          env=env,
                          capture_output=True,
                          check=False,
                          timeout=60,
                      )
                      if result.returncode or not valid_gpg(
                          result.stdout.decode(), plan["fingerprint"]
                      ):
                          raise MirrorError("Pinned artifact signature verification failed")
                  expected = "".join(
                      plan["assets"][name] + "  " + name + "\n"
                      for name in [ASSETS[0], "INTEGRITY.json"]
                  )
                  if blobs["SHA256SUMS"].decode() != expected:
                      raise MirrorError("Checksum list differs from artifact pins")
                  integrity = json.loads(blobs["INTEGRITY.json"])
                  if (
                      any(integrity.get(k) != plan[k] for k in ["commit", "tree", "tag"])
                      or integrity.get("archive_sha256") != plan["assets"][ASSETS[0]]
                      or integrity.get("archive_encrypted") is not False
                      or integrity.get("hybrid_verification") is not True
                  ):
                      raise MirrorError("Authenticated integrity record differs")
                  github = "https://api.github.com/repos/" + REPOSITORY
                  destination = "https://github.com/" + REPOSITORY + ".git"
          
                  def remote_refs():
                      output = git(
                          "ls-remote",
                          destination,
                          "refs/heads/main",
                          "refs/heads/signed-releases",
                          "refs/tags/" + plan["tag"],
                          "refs/tags/" + plan["tag"] + "^{}",
                      )
                      return {line.split()[1]: line.split()[0] for line in output.splitlines()}
          
                  initial = remote_refs()
          
                  def ancestor(old, new):
                      try:
                          git("merge-base", "--is-ancestor", old, new)
                          return True
                      except MirrorError:
                          return False
          
                  updates = refs_to_push(initial, plan, ancestor)
                  if updates:
                      helper = root / "credential_helper.py"
                      helper.write_text(
                          "import os,sys\nf=dict(line.rstrip('\\n').split('=',1) for line in sys.stdin if '=' in line)\nif f.get('protocol')=='https' and f.get('host')=='github.com' and f.get('path') in {'cristiancmoises/crow-studio','cristiancmoises/crow-studio.git'}:\n print('username=x-access-token\\npassword='+os.environ['GH_TOKEN']+'\\n')\n"
                      )
                      emit(
                          operation="push-refs",
                          state="pending",
                          commit=plan["commit"],
                          tag_object=plan["tag_object"],
                      )
                      git(
                          "-c",
                          "credential.useHttpPath=true",
                          "-c",
                          "credential.helper=!python3 " + str(helper),
                          "push",
                          "--atomic",
                          destination,
                          *updates,
                      )
                  final = remote_refs()
                  if final.get("refs/heads/main") != plan["commit"] or refs_to_push(
                      final, plan, ancestor
                  ):
                      raise MirrorError("Remote reference verification failed")
                  status, commit = http(github + "/git/commits/" + plan["commit"], token=token)
                  if status != 200:
                      raise MirrorError("GitHub commit inspection failed")
                  verification = commit.get("verification", {})
                  emit(
                      operation="push-refs",
                      state="confirmed",
                      gpg_verified_with_pinned_key=True,
                      github_signature_verified=verification.get("verified") is True,
                      github_verification_reason=verification.get("reason"),
                  )
                  status, release = http(github + "/releases/tags/" + plan["tag"], token=token)
                  if status not in {200, 404}:
                      raise MirrorError("GitHub release inspection failed")
                  if status == 404:
                      emit(operation="create-draft", state="pending")
                      status, release = http(
                          github + "/releases",
                          token=token,
                          method="POST",
                          data=json.dumps(
                              {
                                  "tag_name": plan["tag"],
                                  "target_commitish": plan["commit"],
                                  "name": "Crow Studio 0.2.0",
                                  "body": plan["notes"],
                                  "draft": True,
                                  "prerelease": False,
                              }
                          ).encode(),
                      )
                      if status != 201:
                          raise MirrorError("Draft creation needs reconciliation")
                  if (
                      release.get("tag_name") != plan["tag"]
                      or release.get("name") != "Crow Studio 0.2.0"
                      or release.get("body") != plan["notes"]
                      or release.get("prerelease") is not False
                  ):
                      raise MirrorError("Existing GitHub release metadata differs")
                  release_url = github + "/releases/" + str(release["id"])
                  status, existing = http(release_url + "/assets?per_page=100", token=token)
                  if (
                      status != 200
                      or len(existing) > len(ASSETS)
                      or any(a.get("name") not in ASSETS for a in existing)
                      or len({a["name"] for a in existing}) != len(existing)
                  ):
                      raise MirrorError("Unexpected GitHub assets")
                  if release.get("draft") is False and {a["name"] for a in existing} != set(
                      ASSETS
                  ):
                      raise MirrorError("Existing public release is incomplete")
                  for name in ASSETS:
                      matching = [a for a in existing if a["name"] == name]
                      if matching:
                          asset = matching[0]
                      else:
                          emit(
                              operation="upload",
                              state="pending",
                              name=name,
                              sha256=plan["assets"][name],
                          )
                          status, asset = http(
                              "https://uploads.github.com/repos/"
                              + REPOSITORY
                              + "/releases/"
                              + str(release["id"])
                              + "/assets?name="
                              + urllib.parse.quote(name, safe=""),
                              token=token,
                              method="POST",
                              data=blobs[name],
                              content_type="application/octet-stream",
                          )
                          if status != 201:
                              raise MirrorError("Asset upload needs reconciliation")
                      asset_url = asset.get("url", "")
                      if not asset_url.startswith(github + "/releases/assets/"):
                          raise MirrorError("Unexpected GitHub asset API URL")
                      status, data = http(asset_url, token=token, binary=True)
                      if status != 200 or not check_asset(
                          asset, name, data, plan["assets"][name]
                      ):
                          raise MirrorError("GitHub draft asset verification failed")
                      emit(
                          operation="upload",
                          state="confirmed",
                          name=name,
                          sha256=plan["assets"][name],
                      )
                  if release.get("draft") is not False:
                      emit(operation="publish", state="pending")
                      status, release = http(
                          release_url,
                          token=token,
                          method="PATCH",
                          data=b'{"draft":false,"make_latest":"true"}',
                      )
                      if status != 200 or release.get("draft") is not False:
                          raise MirrorError("Publication needs reconciliation")
                  status, public = http(github + "/releases/tags/" + plan["tag"])
                  if (
                      status != 200
                      or public.get("draft") is not False
                      or len(public.get("assets", [])) != len(ASSETS)
                      or {asset.get("name") for asset in public.get("assets", [])} != set(ASSETS)
                  ):
                      raise MirrorError("Public release verification failed")
                  for asset in public["assets"]:
                      name = asset.get("name")
                      url = asset.get("browser_download_url", "")
                      if name not in ASSETS or not url.startswith(
                          "https://github.com/"
                          + REPOSITORY
                          + "/releases/download/"
                          + plan["tag"]
                          + "/"
                      ):
                          raise MirrorError("Unexpected public GitHub asset URL")
                      status, data = http(url, binary=True)
                      if status != 200 or not check_asset(
                          asset, name, data, plan["assets"][name]
                      ):
                          raise MirrorError("Anonymous GitHub asset verification failed")
                  emit(
                      operation="publish",
                      state="confirmed",
                      release_url=public.get("html_url"),
                      commit=plan["commit"],
                      tag=plan["tag"],
                      gpg_verified_with_pinned_key=True,
                      github_signature_verified=verification.get("verified") is True,
                      assets=plan["assets"],
                  )
          
          
          if __name__ == "__main__":
              try:
                  main()
              except MirrorError as error:
                  emit(error=str(error))
                  raise SystemExit(1)
              except Exception:  # noqa: BLE001
                  emit(error="Mirror stopped; inspect current release state before retrying")
                  raise SystemExit(1)
          CROW_RELEASE_PYTHON
