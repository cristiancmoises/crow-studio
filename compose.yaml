name: crow-studio
services:
  studio:
    image: crow-studio:0.1.0
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${STUDIO_PORT:-8098}:8080"
    environment:
      STUDIO_PASSWORD: ${STUDIO_PASSWORD:?Execute sh scripts/start.sh primeiro}
      SESSION_SECRET: ${SESSION_SECRET:?Execute sh scripts/start.sh primeiro}
      PUBLIC_URL: ${PUBLIC_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-120000}
    volumes:
      - crow_data:/data
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  crow_data:
